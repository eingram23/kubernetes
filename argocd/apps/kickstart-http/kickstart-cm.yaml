apiVersion: v1
kind: ConfigMap
metadata:
  name: kickstart-config
  namespace: kickstart-http
  labels:
    app: kickstart-http
data:
  ks-rocky9-rke.cfg: |
    # version=RHEL9
    # Use text install
    text

    repo --name="AppStream" --baseurl=file:///run/install/sources/mount-0000-cdrom/AppStream

    %addon com_redhat_kdump --enable --reserve-mb='auto'

    %end

    %packages
    @^minimal-environment

    %end

    # Keyboard layouts
    keyboard --xlayouts='us'
    # System language
    lang en_US.UTF-8

    # Network information
    network  --bootproto=dhcp --device=ens192 --ipv6=auto --activate
    network  --hostname=rocky-temp.local

    # Use CDROM installation media
    cdrom

    # Run the Setup Agent on first boot
    firstboot --enable

    ignoredisk --only-use=sda
    # System bootloader configuration
    bootloader --append="crashkernel=auto" --location=mbr --boot-drive=sda
    # Partition clearing information
    clearpart --none --initlabel
    # Disk partitioning information
    part /boot --fstype="xfs" --ondisk=sda --size=1024
    part pv.213 --fstype="lvmpv" --ondisk=sda --size=59768
    part /boot/efi --fstype="efi" --ondisk=sda --size=600 --fsoptions="umask=0077,shortname=winnt"
    volgroup rl --pesize=4096 pv.213
    logvol /home --fstype="xfs" --size=20480 --name=home --vgname=rl
    logvol / --fstype="xfs" --size=47104 --name=root --vgname=rl
    logvol swap --fstype="swap" --size=2412 --name=swap --vgname=rl

    # System timezone
    timezone America/Los_Angeles --isUtc --ntpservers=2.pool.ntp.org,2.pool.ntp.org,2.pool.ntp.org,2.pool.ntp.org

    # Root password
    rootpw --allow-ssh temppassword

    # Reboot after installation
    reboot
  ks-rocky9.cfg: |
    #version=RHEL9
    # Use text install
    text

    %addon com_redhat_kdump --enable --reserve-mb='auto'

    %end

    %packages
    @^minimal-environment

    %end

    # Keyboard layouts
    keyboard --xlayouts='us'
    # System language
    lang en_US.UTF-8

    # Network information
    network  --bootproto=dhcp --device=ens192 --ipv6=auto --activate
    network  --hostname=rocky-temp.local

    # Use CDROM installation media
    cdrom
    repo --name="BaseOS" --baseurl=file:///run/install/repo/BaseOS
    repo --name="AppStream" --baseurl=file:///run/install/repo/AppStream

    # Run the Setup Agent on first boot
    firstboot --enable

    ignoredisk --only-use=sda
    # System bootloader configuration
    bootloader --append="crashkernel=auto" --location=mbr --boot-drive=sda
    # Partition clearing information
    clearpart --none --initlabel
    # Disk partitioning information
    part /boot --fstype="xfs" --ondisk=sda --size=1024
    part pv.213 --fstype="lvmpv" --ondisk=sda --size=59768
    part /boot/efi --fstype="efi" --ondisk=sda --size=600 --fsoptions="umask=0077,shortname=winnt"
    volgroup rl --pesize=4096 pv.213
    logvol /home --fstype="xfs" --size=20480 --name=home --vgname=rl
    logvol / --fstype="xfs" --size=47104 --name=root --vgname=rl
    logvol swap --fstype="swap" --size=2412 --name=swap --vgname=rl

    # System timezone
    timezone America/Los_Angeles --isUtc --ntpservers=2.pool.ntp.org,2.pool.ntp.org,2.pool.ntp.org,2.pool.ntp.org

    # Root password
    rootpw --allow-ssh temppassword

    # Reboot after installation
    reboot  

  ks-rocky10.cfg: |
    #version=RHEL10
    # Use text install
    text

    %addon com_redhat_kdump --enable --reserve-mb='auto'

    %end

    # Keyboard layouts
    keyboard --vckeymap=us --xlayouts='us'
    # System language
    lang en_US.UTF-8

    # Network information
    network  --bootproto=dhcp --device=ens192 --ipv6=auto --activate
    network  --hostname=rocky-temp.local

    # Use CDROM installation media
    cdrom
    # repo --name="AppStream" --baseurl=file:///run/install/repo/AppStream

    %packages
    @^minimal-environment

    %end

    # Run the Setup Agent on first boot
    firstboot --enable

    # Generated using Blivet version 3.10.0
    ignoredisk --only-use=sda
    # Partition clearing information
    clearpart --none --initlabel
    # Disk partitioning information
    part /boot/efi --fstype="efi" --ondisk=sda --size=600 --fsoptions="umask=0077,shortname=winnt"
    part /boot --fstype="xfs" --ondisk=sda --size=1024
    part pv.966 --fstype="lvmpv" --ondisk=sda --size=59814
    volgroup rl --pesize=4096 pv.966
    logvol swap --fstype="swap" --size=2088 --name=swap --vgname=rl
    logvol / --fstype="xfs" --grow --maxsize=71680 --size=1024 --name=root --vgname=rl
    logvol /home --fstype="xfs" --size=20480 --name=home --vgname=rl

    # System timezone
    timezone America/Los_Angeles --utc 
    timesource --ntp-server=2.pool.ntp.org,2.pool.ntp.org,2.pool.ntp.org,2.pool.ntp.org

    # Root password
    rootpw --allow-ssh temppassword

    # Reboot after installation
    reboot
  ubuntu26-cc: |
    #cloud-config
    autoinstall:
      version: 1
      apt:
        geoip: true
        preserve_sources_list: true
        primary:
          - arches: [amd64, i386]
            uri: http://us.archive.ubuntu.com/ubuntu
          - arches: [default]
            uri: http://ports.ubuntu.com/ubuntu-ports    
      early-commands:
        # Ensures that Packer does not connect too soon.
        - sudo systemctl stop ssh
      locale: en_US
      keyboard:
        layout: us
      storage:
        config:
          - id: disk0
            type: disk
            ptable: gpt
            wipe: superblock-recursive
            grub_device: true

          - id: disk0-boot-efi
            type: partition
            size: 512M
            device: disk0
            flag: boot
            grub_device: true
          - id: disk0-boot-efi-fs
            type: format
            fstype: fat32
            volume: disk0-boot-efi
            label: EFI

          - id: disk0-boot
            type: partition
            size: 1G
            device: disk0
          - id: disk0-boot-fs
            type: format
            fstype: ext4
            volume: disk0-boot
            label: boot

          - id: disk0-root
            type: partition
            size: -1
            device: disk0
          - id: disk0-root-fs
            type: format
            fstype: ext4
            volume: disk0-root
            label: root

          - type: mount
            id: disk0-boot-efi-mnt
            path: /boot/efi
            device: disk0-boot-efi-fs
          - type: mount
            id: disk0-boot-mnt
            path: /boot
            device: disk0-boot-fs
          - type: mount
            id: disk0-root-mnt
            path: /
            device: disk0-root-fs
      identity:
        hostname: ubuntu-server
        username: tempuser
        password: $6$PtgsSOYcedPXOAbi$nbuIwp5OLrZ1opLUOKgfP8D0thOYCaCRHN6v6L38xWBRshvKWb7wor06rn6qwpu7yrK8VuQysUi8JMfT4DQLL.
      network:
        network:
          version: 2
          ethernets:
            ens192:
              dhcp4: true
              dhcp-identifier: mac
      ssh:
        install-server: true
        allow-pw: true
      packages:
        - openssh-server
        - open-vm-tools
        - net-tools
        - cloud-init
      user-data:
        disable_root: false
        package_update: true
        package_upgrade: true
        package_reboot_if_required: true
      timezone: UTC
  metadata: |
    # empty placeholder
